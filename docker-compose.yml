version: "3"
services:
  dvadmin3-web:
    container_name: dvadmin3-web
    ports:
      - "8080:8080"
    build:
      context: ./
      dockerfile: ./docker_env/web/Dockerfile
      args:
        APP_ENV: prod
    environment:
      TZ: Asia/Shanghai
      APP_ENV: prod
    volumes:
      - ./docker_env/nginx/my.conf:/etc/nginx/conf.d/my.conf
      - ./backend/media:/backend/media
    expose:
      - "8080"
    restart: always
    networks:
      network:
        ipv4_address: 177.10.0.11

  dvadmin3-django:
    build:
      context: .
      dockerfile: ./docker_env/django/Dockerfile
    container_name: dvadmin3-django
    working_dir: /backend
    depends_on:
      - dvadmin3-mysql
      - dvadmin3-redis
    environment:
      PYTHONUNBUFFERED: 1
      TZ: Asia/Shanghai
      APP_ENV: prod
      APP_SECRET_KEY: ${APP_SECRET_KEY:-django-insecure-change-me}
      APP_DEBUG: "false"
      APP_DB_ENGINE: django.db.backends.mysql
      APP_DB_HOST: dvadmin3-mysql
      APP_DB_PORT: 3306
      APP_DB_NAME: django-vue3-admin
      APP_DB_USER: root
      APP_DB_PASSWORD: ${MYSQL_PASSWORD}
      APP_REDIS_HOST: dvadmin3-redis
      APP_REDIS_PORT: 6379
      APP_REDIS_PASSWORD: ${REDIS_PASSWORD}
      APP_REDIS_DB: 0
      APP_CELERY_BROKER_DB: 3
      APP_CELERY_RESULT_DB: 4
      APP_CHANNEL_BACKEND: redis
      APP_ALLOWED_HOSTS: "*"
      APP_CORS_ALLOW_ALL: "true"
      APP_LOGIN_CAPTCHA_ENABLED: "true"
    volumes:
      - ./backend:/backend
      - ./logs/log:/var/log
    ports:
      - "8000:8000"
    expose:
      - "8000"
    restart: always
    networks:
      network:
        ipv4_address: 177.10.0.12

  dvadmin3-mysql:
    image: mysql:8.0
    container_name: dvadmin3-mysql
    privileged: true
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: "django-vue3-admin"
      TZ: Asia/Shanghai
    command:
      --wait_timeout=31536000
      --interactive_timeout=31536000
      --max_connections=1000
      --default-authentication-plugin=mysql_native_password
    volumes:
      - "./docker_env/mysql/data:/var/lib/mysql"
      - "./docker_env/mysql/conf.d:/etc/mysql/conf.d"
      - "./docker_env/mysql/logs:/logs"
    networks:
      network:
        ipv4_address: 177.10.0.13

  dvadmin3-celery:
    build:
      context: .
      dockerfile: ./docker_env/celery/Dockerfile
    container_name: dvadmin3-celery
    working_dir: /backend
    depends_on:
      - dvadmin3-mysql
      - dvadmin3-redis
    environment:
      PYTHONUNBUFFERED: 1
      TZ: Asia/Shanghai
      APP_ENV: prod
      APP_SECRET_KEY: ${APP_SECRET_KEY:-django-insecure-change-me}
      APP_DEBUG: "false"
      APP_DB_ENGINE: django.db.backends.mysql
      APP_DB_HOST: dvadmin3-mysql
      APP_DB_PORT: 3306
      APP_DB_NAME: django-vue3-admin
      APP_DB_USER: root
      APP_DB_PASSWORD: ${MYSQL_PASSWORD}
      APP_REDIS_HOST: dvadmin3-redis
      APP_REDIS_PORT: 6379
      APP_REDIS_PASSWORD: ${REDIS_PASSWORD}
      APP_REDIS_DB: 0
      APP_CELERY_BROKER_DB: 3
      APP_CELERY_RESULT_DB: 4
      APP_CHANNEL_BACKEND: redis
      APP_ALLOWED_HOSTS: "*"
      APP_CORS_ALLOW_ALL: "true"
      APP_LOGIN_CAPTCHA_ENABLED: "true"
    volumes:
      - ./backend:/backend
      - ./logs/log:/var/log
    restart: always
    networks:
      network:
        ipv4_address: 177.10.0.14

  dvadmin3-redis:
    image: redis:6.2.6-alpine
    container_name: dvadmin3-redis
    restart: always
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./docker_env/redis/data:/data
      - ./docker_env/redis/redis.conf:/etc/redis/redis.conf
    ports:
      - "6379:6379"
    sysctls:
      - net.core.somaxconn=1024
    command: /bin/sh -c "echo 'vm.overcommit_memory = 1' >> /etc/sysctl.conf && redis-server /etc/redis/redis.conf --appendonly yes --requirepass ${REDIS_PASSWORD}"
    privileged: true
    networks:
      network:
        ipv4_address: 177.10.0.15

networks:
  network:
    ipam:
      driver: default
      config:
        - subnet: '177.10.0.0/16'
